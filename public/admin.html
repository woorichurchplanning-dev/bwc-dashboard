<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>계정 · 권한 관리 · 분당우리교회 대시보드</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--accent:#635bff;--accent-dark:#4f46e5;--accent-light:#f0efff;--bg:#f6f8fa;--surface:#fff;
  --subtle:#f0f2f5;--text:#0a0e1a;--text2:#3c4257;--text3:#697386;--border:rgba(0,0,0,.08);
  --pos:#09825d;--pos-bg:#edfaf4;--neg:#c0123c;--neg-bg:#fff0f3;--warn:#a16207;--warn-bg:#fefce8;
  --font:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:var(--font);color:var(--text);font-size:14px}
header{display:flex;align-items:center;gap:12px;padding:0 24px;height:60px;background:var(--surface);
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.cross{width:30px;height:30px;background:var(--accent);border-radius:8px;position:relative;flex-shrink:0}
.cross::before,.cross::after{content:'';position:absolute;background:#fff;border-radius:2px}
.cross::before{width:3px;height:16px;left:13.5px;top:7px}
.cross::after{width:12px;height:3px;left:9px;top:13.5px}
h1{font-size:15px;font-weight:700;margin:0}
header .sub{font-size:11px;color:var(--text3)}
.spacer{flex:1}
main{max-width:1080px;margin:0 auto;padding:24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:18px}
.card h2{font-size:15px;margin:0 0 4px}
.card .desc{font-size:12px;color:var(--text3);margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;
  padding:8px 10px;border-bottom:1px solid var(--border)}
td{padding:11px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:0}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.badge.admin{background:var(--accent-light);color:var(--accent)}
.badge.staff{background:var(--subtle);color:var(--text2)}
.badge.init{background:var(--warn-bg);color:var(--warn);margin-left:4px}
.tabchips{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:var(--subtle);color:var(--text2);border-radius:6px;padding:2px 7px;font-size:11px}
.chip.all{background:var(--pos-bg);color:var(--pos);font-weight:700}
button{font-family:inherit;font-size:13px;font-weight:600;border-radius:8px;cursor:pointer;
  padding:7px 13px;border:1px solid var(--border);background:var(--surface);color:var(--text2);
  transition:background .15s,border-color .15s}
button:hover:not(:disabled){background:var(--subtle)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover:not(:disabled){background:var(--accent-dark)}
button.danger{color:var(--neg);border-color:rgba(192,18,60,.25)}
button.danger:hover:not(:disabled){background:var(--neg-bg)}
button:disabled{opacity:.5;cursor:not-allowed}
label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin:0 0 6px}
input[type=text],input[type=password],select{width:100%;padding:9px 11px;font-size:13px;font-family:inherit;
  border:1px solid rgba(0,0,0,.14);border-radius:8px;background:var(--surface);color:var(--text)}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,91,255,.12)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:16px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;align-items:center;gap:6px;font-weight:500;font-size:12.5px;
  background:var(--subtle);padding:6px 11px;border-radius:8px;cursor:pointer;margin:0}
.checks input{margin:0}
.msg{padding:11px 14px;border-radius:9px;font-size:13px;line-height:1.6;margin-bottom:16px;display:none}
.msg.on{display:block}
.msg.ok{background:var(--pos-bg);color:var(--pos)}
.msg.err{background:var(--neg-bg);color:var(--neg)}
.msg.warn{background:var(--warn-bg);color:var(--warn)}
.row-actions{display:flex;gap:6px;justify-content:flex-end}
@media (max-width:720px){main{padding:14px}.card{padding:16px}th:nth-child(4),td:nth-child(4){display:none}}

/* ── 부서별 묶음 ── */
.summary{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.stat{background:var(--bg2,#f6f8fa);border:1px solid var(--line,rgba(0,0,0,.08));
  border-radius:9px;padding:8px 12px;font-size:12px;line-height:1.35}
.stat b{display:block;font-size:19px;font-weight:700;letter-spacing:-.02em}
.stat.warn b{color:var(--warn)}
.grp{border:1px solid var(--line,rgba(0,0,0,.08));border-radius:10px;margin-bottom:10px;overflow:hidden}
.grp-hd{display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
  padding:11px 14px;background:var(--bg2,#f6f8fa);border:0;font:inherit}
.grp-hd:hover{background:var(--bg3,#eef1f4)}
.grp-name{font-weight:700;font-size:13.5px}
.grp-count{font-size:12px;color:var(--text3);font-variant-numeric:tabular-nums}
.grp-spacer{flex:1}
.grp-arrow{color:var(--text3);font-size:11px;transition:transform .15s}
.grp.closed .grp-arrow{transform:rotate(-90deg)}
.grp.closed .grp-body{display:none}
.grp-body{overflow-x:auto}
.grp-body table{margin:0}
.grp-body th{background:#fff}
#q{padding:9px 12px;border:1px solid var(--line,rgba(0,0,0,.15));border-radius:9px;font:inherit;font-size:13px}
</style>
</head>
<body>
<header>
  <div class="cross"></div>
  <div><h1>계정 · 권한 관리</h1><div class="sub">분당우리교회 사역 데이터 대시보드</div></div>
  <div class="spacer"></div>
  <button onclick="location.href='/index.html'">← 대시보드</button>
  <button onclick="logout()">로그아웃</button>
</header>

<main>
  <div class="msg" id="msg"></div>

  <div class="card">
    <h2>계정 목록</h2>
    <div class="desc">교역자별로 볼 수 있는 탭을 지정합니다. 주간현황은 모두에게 공통으로 열립니다.
      <b>초기 비밀번호</b> 표시가 있는 계정은 아직 본인이 비밀번호를 바꾸지 않은 상태입니다.</div>
    <div class="summary" id="summary"></div>
    <input type="search" id="q" placeholder="이름 · 아이디 · 부서로 찾기" autocomplete="off"
           oninput="renderRows()" style="width:100%;margin:0 0 14px">
    <div id="groups"><div style="color:var(--text3);font-size:13px">불러오는 중…</div></div>
  </div>

  <div class="card">
    <h2 id="form-title">계정 추가</h2>
    <div class="desc" id="form-desc">아이디는 교역자 이름을 그대로 쓰면 됩니다. 비밀번호는 전화번호 뒷자리 같은 <b>초기 비밀번호</b>를 넣어 전달하세요 — 본인이 첫 로그인에서 반드시 바꾸게 됩니다.</div>
    <form id="form">
      <div class="grid">
        <div><label for="f-id">아이디</label><input type="text" id="f-id" autocapitalize="off" spellcheck="false" placeholder="김철수" required></div>
        <div><label for="f-name">이름</label><input type="text" id="f-name" placeholder="김철수 목사" required></div>
        <div><label for="f-dept">부서</label>
          <input type="text" id="f-dept" list="dept-list" placeholder="교구 / 주일학교 / 청년교구 …" autocomplete="off">
          <datalist id="dept-list"></datalist></div>
        <div><label for="f-role">역할</label>
          <select id="f-role"><option value="staff">담당 (staff)</option><option value="admin">관리자 (admin)</option></select></div>
        <div><label for="f-pw">초기 비밀번호</label><input type="password" id="f-pw" autocomplete="new-password" placeholder="전화번호 뒷자리 등 4자 이상"></div>
      </div>

      <div id="perm-block">
        <label>권한 탭</label>
        <div class="checks" id="f-tabs" style="margin-bottom:16px"></div>
        <label>주일학교 담당 부서 <span style="font-weight:400;color:var(--text3)">— 선택하지 않으면 전체</span></label>
        <div class="checks" id="f-school" style="margin-bottom:16px"></div>

        <label>청년교구 담당 부 <span style="font-weight:400;color:var(--text3)">— 선택하지 않으면 전체</span></label>
        <div class="checks" id="f-youth" style="margin-bottom:16px"></div>

        <label>담당 팀 <span style="font-weight:400;color:var(--text3)">— 선택하지 않으면 담당 부의 모든 팀</span></label>
        <div class="checks" id="f-youthteams" style="margin-bottom:16px"></div>

        <label>담당 교구 <span style="font-weight:400;color:var(--text3)">— 리더십·소그룹. 선택하지 않으면 전체</span></label>
        <div class="checks" id="f-districts" style="margin-bottom:18px"></div>
      </div>

      <div style="display:flex;gap:8px">
        <button type="submit" class="primary" id="f-submit">추가</button>
        <button type="button" id="f-cancel" style="display:none" onclick="resetForm()">취소</button>
      </div>
    </form>
  </div>
</main>

<script>
let STATE = { users: [], tabDefs: [], schoolDepts: [], readOnly: false, me: '', editing: null };
const $ = (id) => document.getElementById(id);

function show(kind, text) {
  const m = $('msg'); m.className = 'msg on ' + kind; m.textContent = text;
  if (kind === 'ok') setTimeout(() => m.classList.remove('on'), 4000);
}

async function api(method, body) {
  const res = await fetch('/api/users', {
    method,
    headers: body ? { 'content-type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
    cache: 'no-store',
  });
  if (res.status === 401) { location.replace('/login.html'); throw new Error('unauthorized'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.message || data.error || ('HTTP ' + res.status));
  return data;
}

function renderChecks() {
  $('f-tabs').innerHTML = STATE.tabDefs.map(t =>
    `<label><input type="checkbox" name="tab" value="${t.key}"${t.key === 'home' ? ' checked disabled' : ''}> ${t.label}</label>`).join('');
  $('f-school').innerHTML = STATE.schoolDepts.map(d =>
    `<label><input type="checkbox" name="school" value="${d}"> ${d}</label>`).join('');
  $('f-youth').innerHTML = (STATE.youthDepts || []).map(d =>
    `<label><input type="checkbox" name="youth" value="${d}"> ${d}</label>`).join('');
  $('f-youthteams').innerHTML = (STATE.youthTeams || []).map(t =>
    `<label><input type="checkbox" name="yteam" value="${t}"> ${t}</label>`).join('');
  $('f-districts').innerHTML = (STATE.districts || []).map(d =>
    `<label><input type="checkbox" name="dist" value="${d}"> ${d}</label>`).join('');
  // 이미 쓰고 있는 부서도 함께 고를 수 있게 넣는다
  const seen = [...new Set([...(STATE.depts || []), ...STATE.users.map(u => u.dept).filter(Boolean)])];
  $('dept-list').innerHTML = seen.map(d => `<option value="${d}">`).join('');
}

function deptOf(u) {
  if (u.dept) return u.dept;
  // 부서를 안 넣은 계정은 볼 수 있는 것으로 미루어 묶는다
  if (u.role === 'admin') return '관리자';
  const t = u.effectiveTabs || [];
  if (t.includes('district') && t.length <= 2) return '교구';
  if (t.includes('school') && t.length <= 2) return '주일학교';
  if (t.includes('youth')) return '청년교구';
  if (t.length <= 1) return '미지정';
  return '기타';
}

function renderSummary() {
  const us = STATE.users;
  const init = us.filter(u => u.mustChangePassword).length;
  const admins = us.filter(u => u.role === 'admin').length;
  $('summary').innerHTML = [
    ['전체 계정', us.length, ''],
    ['관리자', admins, ''],
    ['비밀번호 미변경', init, init ? 'warn' : ''],
    ['부서', new Set(us.map(deptOf)).size, ''],
  ].map(([k, v, cls]) => `<div class="stat ${cls}"><b>${v}</b>${k}</div>`).join('');
}

const CLOSED = new Set();
function toggleGrp(name) {
  CLOSED.has(name) ? CLOSED.delete(name) : CLOSED.add(name);
  renderRows();
}

function renderRows() {
  renderSummary();
  const box = $('groups');
  const q = ($('q')?.value || '').trim().toLowerCase();
  const match = u => !q || [u.id, u.name, deptOf(u)].join(' ').toLowerCase().includes(q);
  const shown = STATE.users.filter(match);

  if (!STATE.users.length) {
    box.innerHTML = '<div style="color:var(--text3);font-size:13px">계정이 없습니다. 아래에서 추가하세요.</div>';
    return;
  }
  if (!shown.length) {
    box.innerHTML = '<div style="color:var(--text3);font-size:13px">찾는 계정이 없습니다.</div>';
    return;
  }

  const groups = new Map();
  shown.forEach(u => {
    const d = deptOf(u);
    if (!groups.has(d)) groups.set(d, []);
    groups.get(d).push(u);
  });
  // 관리자를 맨 위로, 나머지는 인원이 많은 순
  const order = [...groups.entries()].sort((a, b) =>
    (a[0] === '관리자' ? -1 : b[0] === '관리자' ? 1 : 0) || b[1].length - a[1].length || a[0].localeCompare(b[0]));

  box.innerHTML = order.map(([name, list]) => {
    const init = list.filter(u => u.mustChangePassword).length;
    const closed = CLOSED.has(name) ? ' closed' : '';
    return `<div class="grp${closed}">
      <button class="grp-hd" onclick="toggleGrp('${name.replace(/'/g, "\\'")}')">
        <span class="grp-arrow">▼</span>
        <span class="grp-name">${name}</span>
        <span class="grp-count">${list.length}명${init ? ` · 비밀번호 미변경 ${init}` : ''}</span>
        <span class="grp-spacer"></span>
      </button>
      <div class="grp-body"><table>
        <thead><tr><th>아이디</th><th>이름</th><th>역할</th><th>권한 탭</th><th></th></tr></thead>
        <tbody>${list.map(rowHtml).join('')}</tbody>
      </table></div>
    </div>`;
  }).join('');
}

function rowHtml(u) {
  const labelOf = (k) => (STATE.tabDefs.find(t => t.key === k) || {}).label || k;
  return `<tr>
      <td><code>${u.id}</code></td>
      <td>${u.name}${u.mustChangePassword ? ' <span class="badge init">초기 비밀번호</span>' : ''}</td>
      <td><span class="badge ${u.role}">${u.role === 'admin' ? '관리자' : '담당'}</span></td>
      <td><div class="tabchips">${
        u.tabs === '*' ? '<span class="chip all">전체</span>'
          : u.effectiveTabs.map(k => `<span class="chip">${labelOf(k)}</span>`).join('')
      }${(u.schoolDepts || []).length ? `<span class="chip">주일학교 ${u.schoolDepts.join('·')}</span>` : ''
      }${(u.youthDepts || []).length ? `<span class="chip">청년 ${u.youthDepts.join('·')}</span>` : ''
      }${(u.youthTeams || []).length ? `<span class="chip">${u.youthTeams.join('·')}</span>` : ''
      }${(u.districts || []).length ? `<span class="chip">교구 ${u.districts.join('·')}</span>` : ''}</div></td>
      <td><div class="row-actions">
        <button onclick="edit('${u.id}')">수정</button>
        <button class="danger" onclick="remove('${u.id}')" ${u.id === STATE.me ? 'disabled' : ''}>삭제</button>
      </div></td>
    </tr>`;
}

function resetForm() {
  STATE.editing = null;
  $('form').reset();
  $('f-id').disabled = false;
  $('form-title').textContent = '계정 추가';
  $('form-desc').innerHTML = '아이디는 교역자 이름을 그대로 쓰면 됩니다. 비밀번호는 전화번호 뒷자리 같은 <b>초기 비밀번호</b>를 넣어 전달하세요 — 본인이 첫 로그인에서 반드시 바꾸게 됩니다.';
  $('f-submit').textContent = '추가';
  $('f-cancel').style.display = 'none';
  document.querySelectorAll('#f-tabs input, #f-school input, #f-youth input, #f-youthteams input, #f-districts input')
    .forEach(c => { if (!c.disabled) c.checked = false; });
  toggleRole();
}

function edit(id) {
  const u = STATE.users.find(x => x.id === id); if (!u) return;
  STATE.editing = id;
  $('f-id').value = u.id; $('f-id').disabled = true;
  $('f-name').value = u.name;
  $('f-dept').value = u.dept || '';
  $('f-role').value = u.role;
  $('f-pw').value = '';
  document.querySelectorAll('#f-tabs input').forEach(c => {
    if (!c.disabled) c.checked = u.tabs === '*' || (u.tabs || []).includes(c.value);
  });
  document.querySelectorAll('#f-school input').forEach(c => { c.checked = (u.schoolDepts || []).includes(c.value); });
  document.querySelectorAll('#f-youth input').forEach(c => { c.checked = (u.youthDepts || []).includes(c.value); });
  document.querySelectorAll('#f-youthteams input').forEach(c => { c.checked = (u.youthTeams || []).includes(c.value); });
  document.querySelectorAll('#f-districts input').forEach(c => { c.checked = (u.districts || []).includes(c.value); });
  $('form-title').textContent = `${u.name} (${u.id}) 수정`;
  $('form-desc').textContent = '비밀번호 칸을 비워 두면 기존 비밀번호가 유지됩니다. 값을 넣으면 초기 비밀번호로 재설정되고 본인이 다시 바꿔야 합니다.';
  $('f-submit').textContent = '저장';
  $('f-cancel').style.display = '';
  toggleRole();
  $('form-title').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

async function remove(id) {
  const u = STATE.users.find(x => x.id === id); if (!u) return;
  if (!confirm(`${u.name}(${id}) 계정을 삭제할까요?`)) return;
  try { const r = await api('DELETE', { id }); STATE.users = r.users; renderRows(); show('ok', '삭제되었습니다.'); }
  catch (e) { show('err', e.message); }
}

function toggleRole() {
  const isAdmin = $('f-role').value === 'admin';
  $('perm-block').style.opacity = isAdmin ? .45 : 1;
  document.querySelectorAll('#f-tabs input, #f-school input, #f-youth input, #f-youthteams input, #f-districts input')
    .forEach(c => { if (c.value !== 'home') c.disabled = isAdmin; });
}
$('f-role').addEventListener('change', toggleRole);

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const role = $('f-role').value;
  const payload = {
    id: $('f-id').value.trim().toLowerCase(),
    name: $('f-name').value.trim(),
    dept: $('f-dept').value.trim(),
    role,
    tabs: role === 'admin' ? '*' : [...document.querySelectorAll('#f-tabs input:checked')].map(c => c.value),
    schoolDepts: role === 'admin' ? [] : [...document.querySelectorAll('#f-school input:checked')].map(c => c.value),
    youthDepts:  role === 'admin' ? [] : [...document.querySelectorAll('#f-youth input:checked')].map(c => c.value),
    youthTeams:  role === 'admin' ? [] : [...document.querySelectorAll('#f-youthteams input:checked')].map(c => c.value),
    districts:   role === 'admin' ? [] : [...document.querySelectorAll('#f-districts input:checked')].map(c => c.value),
  };
  const pw = $('f-pw').value;
  if (pw) payload.password = pw;
  $('f-submit').disabled = true;
  try {
    const r = await api(STATE.editing ? 'PUT' : 'POST', payload);
    STATE.users = r.users; renderRows(); resetForm();
    show('ok', '저장되었습니다. 변경된 권한은 해당 사용자가 다시 로그인하면 적용됩니다.');
  } catch (e) { show('err', e.message); }
  finally { $('f-submit').disabled = false; }
});

async function logout() {
  try { await fetch('/api/logout', { method: 'POST' }); } catch {}
  try { if (window.caches) for (const k of await caches.keys()) await caches.delete(k); } catch {}
  location.replace('/login.html');
}

(async () => {
  try {
    const d = await api('GET');
    Object.assign(STATE, d);
    renderChecks(); renderRows(); toggleRole();
    if (d.readOnly) {
      show('warn', '읽기 전용 모드입니다. GITHUB_TOKEN 환경변수가 없어 화면에서 계정을 저장할 수 없습니다. scripts/user.mjs 로 관리하세요.');
      $('f-submit').disabled = true;
    }
  } catch (e) { show('err', '불러오지 못했습니다: ' + e.message); }
})();
</script>
