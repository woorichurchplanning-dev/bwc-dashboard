<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀번호 변경 · 분당우리교회 대시보드</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--accent:#635bff;--accent-dark:#4f46e5;--bg:#f6f8fa;--surface:#fff;--text:#0a0e1a;
  --text2:#3c4257;--text3:#697386;--border:rgba(0,0,0,.08);--neg:#c0123c;--neg-bg:#fff0f3;
  --pos:#09825d;--pos-bg:#edfaf4;--warn:#a16207;--warn-bg:#fefce8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);
  font-family:'Pretendard',-apple-system,sans-serif;color:var(--text);padding:24px}
.card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:34px 30px;box-shadow:0 12px 32px rgba(0,0,0,.06)}
h1{font-size:17px;margin:0 0 6px}
.desc{font-size:12.5px;color:var(--text3);line-height:1.6;margin-bottom:20px}
label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px}
input{width:100%;padding:11px 13px;font-size:14px;font-family:inherit;border:1px solid rgba(0,0,0,.14);
  border-radius:9px;margin-bottom:15px}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,91,255,.12)}
button{width:100%;padding:12px;font-size:14px;font-weight:700;font-family:inherit;color:#fff;
  background:var(--accent);border:0;border-radius:9px;cursor:pointer}
button:hover:not(:disabled){background:var(--accent-dark)}
button:disabled{opacity:.6;cursor:not-allowed}
.msg{display:none;font-size:12.5px;line-height:1.6;padding:11px 13px;border-radius:8px;margin-bottom:16px}
.msg.on{display:block}
.msg.err{background:var(--neg-bg);color:var(--neg)}
.msg.ok{background:var(--pos-bg);color:var(--pos)}
.notice{background:var(--warn-bg);color:var(--warn);font-size:12.5px;line-height:1.6;
  padding:11px 13px;border-radius:8px;margin-bottom:18px}
.foot{margin-top:18px;text-align:center}
.foot a{font-size:12px;color:var(--text3);text-decoration:none}
</style>
</head>
<body>
<form class="card" id="f">
  <h1>비밀번호 변경</h1>
  <div class="desc" id="d">본인만 아는 비밀번호로 바꿔주세요.</div>
  <div class="notice" id="first" style="display:none">
    처음 받으신 <b>초기 비밀번호</b>는 다른 분도 짐작할 수 있습니다.
    담당 부서 자료를 보호하려면 지금 바꿔주세요.
  </div>
  <div class="msg" id="m"></div>
  <label for="cur">현재 비밀번호</label><input id="cur" type="password" required autocomplete="current-password">
  <label for="pw">새 비밀번호 (8자 이상)</label><input id="pw" type="password" required autocomplete="new-password">
  <label for="pw2">새 비밀번호 확인</label><input id="pw2" type="password" required autocomplete="new-password">
  <button type="submit" id="b">변경하기</button>
  <div class="foot"><a href="#" id="lo">로그아웃</a></div>
</form>
<script>
const m = document.getElementById('m'), b = document.getElementById('b');
const say = (k, t) => { m.className = 'msg on ' + k; m.textContent = t; };

fetch('/api/me', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(me => {
  if (!me) { location.replace('/login.html'); return; }
  document.getElementById('d').textContent = `${me.name}님, 본인만 아는 비밀번호로 바꿔주세요.`;
  if (me.mustChangePassword) document.getElementById('first').style.display = '';
}).catch(() => {});

document.getElementById('lo').addEventListener('click', async (e) => {
  e.preventDefault();
  try { await fetch('/api/logout', { method: 'POST' }); } catch {}
  location.replace('/login.html');
});

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  if (pw !== document.getElementById('pw2').value) return say('err', '새 비밀번호가 서로 다릅니다.');
  b.disabled = true; b.textContent = '변경 중…';
  try {
    const res = await fetch('/api/password', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ current: document.getElementById('cur').value, password: pw }),
    });
    const d = await res.json().catch(() => ({}));
    if (res.ok) { say('ok', '변경되었습니다. 대시보드로 이동합니다…'); setTimeout(() => location.replace('/index.html'), 1000); return; }
    say('err', d.message || '실패했습니다.');
  } catch { say('err', '연결에 실패했습니다.'); }
  finally { b.disabled = false; b.textContent = '변경하기'; }
});
</script>
</body>
</html>
