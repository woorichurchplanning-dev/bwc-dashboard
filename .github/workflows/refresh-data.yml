name: Refresh dashboard data

on:
  repository_dispatch:     # 시트 수정 시 Apps Script가 즉시 트리거 (event_type: sheet-updated)
    types: [sheet-updated]
  schedule:
    - cron: '0 20 * * *'   # 매일 UTC 20:00 = KST 05:00 (백스톱)
    - cron: '0 4 * * 1'    # 월 UTC 04:00 = KST 13:00 (주말 집계 반영)
  workflow_dispatch:       # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest data → data.json
        run: bash scripts/refresh-data.sh

      # data.json은 커밋하지 않는다. 레포가 public이라 커밋하면 출석 데이터가
      # raw.githubusercontent.com 으로 그대로 공개된다. 대신 생성한 파일을
      # 그대로 Vercel에 올려 로그인 뒤에서만 열리게 한다.
      - name: Sanity check
        run: |
          test -s public/data.json || { echo "data.json이 비어 있음 — 배포 중단"; exit 1; }
          node -e "const d=require('./public/data.json'); if(!d.weekCount) throw new Error('weekCount 없음'); console.log('주차:', d.weekCount, d.weekRange.join(' ~ '))"

      # 예전에는 vercel deploy 로 파일을 올렸는데, 배포 토큰이 회전하거나
      # scope가 어긋나면 데이터 갱신이 통째로 멈췄다. 이제 Blob에만 쓴다.
      # 이 토큰은 Blob 스토어 하나에만 쓰이고 회전하지 않는다.
      - name: Publish data
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          STORE_KEY: ${{ secrets.STORE_KEY }}
        run: node scripts/push-data.mjs
