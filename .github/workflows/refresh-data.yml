name: Refresh dashboard data

on:
  # 남겨는 두지만 지금 이걸 쏘는 곳은 없다. 즉시 반영은 Apps Script가
  # /api/ingest 로 직접 밀어 넣는 쪽(DashboardPush.js)이 맡는다.
  repository_dispatch:
    types: [sheet-updated]
  schedule:
    # 15분마다 '최근 3주만' 받아 얹는다. 이게 평소의 반영 통로다.
    # (Apps Script 는 한 주에 10초쯤 걸려 3주면 30초 안팎이다.)
    - cron: '*/15 * * * *'
    # 하루 한 번 전체를 다시 만든다 — UTC 19:30 = KST 04:30
    - cron: '30 19 * * *'
  workflow_dispatch:       # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 어떤 일정으로 깨어났는지에 따라 하는 일이 다르다.
      # 전체 재수집은 Apps Script 실행시간을 8분쯤 쓰므로 하루 한 번만 한다.
      - name: 최근 주차만 반영
        if: github.event_name != 'schedule' || github.event.schedule == '*/15 * * * *'
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: node scripts/refresh-recent.mjs 3

      - name: 전체 다시 수집
        if: github.event_name == 'schedule' && github.event.schedule == '30 19 * * *'
        run: bash scripts/refresh-data.sh

      - name: 형식 확인
        if: github.event_name == 'schedule' && github.event.schedule == '30 19 * * *'
        run: |
          test -s public/data.json || { echo "data.json이 비어 있음 — 중단"; exit 1; }
          node -e "const d=require('./public/data.json'); if(!d.weekCount) throw new Error('weekCount 없음'); console.log('주차:', d.weekCount, d.weekRange.join(' ~ '))"

      - name: 전체 스냅샷 올리기
        if: github.event_name == 'schedule' && github.event.schedule == '30 19 * * *'
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          STORE_KEY: ${{ secrets.STORE_KEY }}
        run: node scripts/push-data.mjs
